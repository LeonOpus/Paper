train_file: ['data/vqa_train.json', 'data/vqa_val.json']
test_file:  'data/vqa_test.json'
answer_list: 'data/answer_list.json'
image_root:  'data/coco/images/'
vqa_root:    'data/vqa/'

vision_encoder: 'vit_base_patch16_224'
text_encoder:   'bert-base-uncased'
image_res: 480
num_ans_candidates: 128

batch_size_train: 16
batch_size_test:  32
optimizer: {opt: adamW, lr: 2e-5, weight_decay: 0.02}
schedular: {sched: cosine, lr: 2e-5, epochs: 10, min_lr: 1e-6,
            warmup_lr: 1e-5, warmup_epochs: 1, cooldown_epochs: 0}
