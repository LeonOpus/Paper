train_file: ['data/coco_train.json']
val_file:   'data/coco_val.json'
test_file:  'data/coco_test.json'
image_root: 'data/coco/images/'

# model
vision_encoder: 'vit_base_patch16_224'
text_encoder:   'bert-base-uncased'
image_res: 224
embed_dim: 256
temp: 0.07
k_test: 128

# training
batch_size_train: 64
batch_size_test:  64
optimizer: {opt: adamW, lr: 1e-5, weight_decay: 0.02}
schedular: {sched: cosine, lr: 1e-5, epochs: 5, min_lr: 1e-6,
            warmup_lr: 1e-5, warmup_epochs: 1, cooldown_epochs: 0}
