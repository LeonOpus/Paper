train_file: ['data/flickr30k_train.json']
val_file:   'data/flickr30k_val.json'
test_file:  'data/flickr30k_test.json'
image_root: 'data/flickr30k/images/'

vision_encoder: 'vit_base_patch16_224'
text_encoder:   'bert-base-uncased'
image_res: 384
embed_dim: 256
temp: 0.07
k_test: 128

batch_size_train: 32
batch_size_test:  64
optimizer: {opt: adamW, lr: 1e-5, weight_decay: 0.02}
schedular: {sched: cosine, lr: 1e-5, epochs: 10, min_lr: 1e-6,
            warmup_lr: 1e-5, warmup_epochs: 1, cooldown_epochs: 0}
