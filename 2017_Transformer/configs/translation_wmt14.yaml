# Transformer-base (Attention Is All You Need, Table 3)
# Target: BLEU 27.3 on WMT14 EN->DE newstest2014

# Data
src_lang: "en"
tgt_lang: "de"
vocab_size: 32000        # shared BPE vocab
max_len: 128

# Model (base config)
d_model: 512
n_heads: 8
n_layers: 6
d_ff: 2048
dropout: 0.1

# Training
epochs: 20
batch_size: 4096         # tokens per batch (dynamic batching)
warmup_steps: 4000
label_smoothing: 0.1
max_grad_norm: 1.0
fp16: true

# Eval
beam_size: 4
length_penalty: 0.6

# Output
output_dir: "wmt14_base"
